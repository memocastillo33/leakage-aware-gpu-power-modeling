seed: 42

data:
  n_devices: 10
  n_samples_per_device: 500
  noise_std: 5.0
  output_path: data/synthetic_gpu_telemetry.csv

features:
  rolling_window: 5
  target_col: power_w
  group_col: device_id
  feature_cols:
    - gpu_util
    - mem_util
    - temp_c
    - clock_mhz
    - gpu_util_roll_mean
    - mem_util_roll_mean
    - temp_clock_ratio
    - util_product

evaluation:
  n_splits: 5

models:
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_leaf: 5
  mlp:
    hidden_dims: [64, 32, 16]
    lr: 0.001
    epochs: 100
    batch_size: 64
    dropout: 0.2

hyperparameter_sweep:
  random_forest:
    n_estimators: [50, 100, 200]
    max_depth: [5, 10, 20]

ablation:
  groups:
    utilization: [gpu_util, mem_util, gpu_util_roll_mean, mem_util_roll_mean]
    thermal: [temp_c, temp_clock_ratio]
    frequency: [clock_mhz]
    interaction: [util_product]

outputs:
  base_dir: outputs
  figures_dir: outputs/figures
  reports_dir: outputs/reports
